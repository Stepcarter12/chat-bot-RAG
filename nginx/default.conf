# ── nginx/default.conf — Production reverse proxy ─────────────────────────────
#
# Trước khi deploy: thay YOUR_DOMAIN bằng domain thật (3 chỗ bên dưới)
# Lệnh nhanh trên Linux:
#   sed -i 's/YOUR_DOMAIN/your.domain.com/g' nginx/default.conf
#
# Services được proxy:
#   /api/, /messenger/, /health, /docs → FastAPI (api:8080)
#   /                                  → Streamlit (streamlit:8501, WebSocket)
#
# Port nội bộ (api:8081, flower:5555, streamlit:8501) phải được block bởi
# UFW/firewall của VPS — chỉ port 80 và 443 được mở ra ngoài.

# ── HTTP: certbot challenge + redirect sang HTTPS ─────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Cho phép certbot webroot tự động renew certificate mà không cần restart nginx
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mọi request khác → redirect 301 sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: SSL termination + reverse proxy ────────────────────────────────────
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # Certificate từ Let's Encrypt (certbot tạo)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # SSL params chuẩn của certbot (tải về trong deployment guide)
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Upload file tài liệu tối đa 20MB (phù hợp ingest PDF/docx)
    client_max_body_size 20M;

    # Timeout dài hơn cho RAG pipeline (ChromaDB + LLM có thể mất 10-20s)
    proxy_connect_timeout 30s;
    proxy_read_timeout    120s;
    proxy_send_timeout    30s;

    # Header chung cho tất cả upstream
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ── FastAPI: REST API + Facebook Messenger webhook + health check ──────────
    # Regex match các prefix thuộc FastAPI (không phải Streamlit)
    location ~ ^/(api|messenger|health|docs|openapi\.json|redoc) {
        proxy_pass http://api:8080;
    }

    # ── Streamlit frontend ────────────────────────────────────────────────────
    # Cần WebSocket (Upgrade header) để live-update hoạt động
    location / {
        proxy_pass         http://streamlit:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Timeout 24h để WebSocket không bị đóng khi user đang chat
        proxy_read_timeout 86400;
        proxy_buffering    off;
    }
}
